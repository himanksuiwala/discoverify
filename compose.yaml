services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lpr_db}
      POSTGRES_USER: ${POSTGRES_USER:-lpr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lpr_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - lpr_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  lpr_postgres_data:
